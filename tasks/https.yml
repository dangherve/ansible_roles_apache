- debug:
    msg: "******************** install {{ site.servername }}-{{ hostname }}.{{ domain }} ********************"

- name: certificat  main
  shell: "certbot certonly --non-interactive --agree-tos --{{certbot_type}} --email root@dang.ovh  --domain {{ hostname }}.{{ domain }} --expand"
  ignore_errors: yes
  when: site.main is defined
  register: result
  notify:
    - restart apache

- name: certificat
  shell: "certbot certonly --non-interactive --agree-tos --{{certbot_type}} --email root@dang.ovh  --domain {{ site.servername }}-{{ hostname }}.{{ domain }} --expand"
  ignore_errors: yes
  when: site.main is not defined
  register: result
  notify:
    - restart apache

- name: construct ssl
  set_fact:
    apache_vhosts_ssl: "{{ apache_vhosts_ssl + [site] }}"
  when: result.failed is false
